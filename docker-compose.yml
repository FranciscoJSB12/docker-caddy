version: "3.7"

services:
  caddy:
    image: caddy-rate-limiting
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - ${DATA_FOLDER}/config:/config
      - ${DATA_FOLDER}/config/Caddyfile:/etc/caddy/Caddyfile
      - ${DATA_FOLDER}/static-files:/srv
    networks:
      - caddy_network

volumes:
  caddy_data:
    external: true

networks:
  caddy_network:
    external: true
